<!DOCTYPE html>
<html lang="fr" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette Dofus - Tirage Épuré & Rapide</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        krosmoz: {
                            bg: '#080c14',
                            card: '#0f172a',
                            border: '#1e293b',
                            teal: '#0d9488',
                            cyan: '#06b6d4',
                            gold: '#fbbf24',
                            goldGlow: '#f59e0b'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Cinzel', 'Georgia', 'serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body {
            background-color: #080c14;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(6, 182, 212, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(251, 191, 36, 0.08) 0%, transparent 50%);
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .font-display {
            font-family: 'Cinzel', Georgia, serif;
        }

        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(6, 182, 212, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Giant Glowing Button */
        .btn-neon-gold {
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            color: #080c14;
            font-weight: 900;
            letter-spacing: 0.05em;
            box-shadow: 0 0 25px rgba(251, 191, 36, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.4);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-neon-gold:hover:not(:disabled) {
            background: linear-gradient(135deg, #fcd34d 0%, #f59e0b 100%);
            box-shadow: 0 0 40px rgba(251, 191, 36, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            transform: translateY(-2px) scale(1.02);
        }

        .btn-neon-gold:active:not(:disabled) {
            transform: translateY(1px) scale(0.98);
        }

        .btn-neon-gold:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none !important;
            transform: none !important;
        }

        /* Modal Animation */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.7) translateY(30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-pop-in {
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #080c14;
        }
        ::-webkit-scrollbar-thumb {
            background: #0e7490;
            border-radius: 4px;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen antialiased selection:bg-cyan-500 selection:text-black">

    <!-- Header -->
    <header class="w-full py-4 px-6 border-b border-cyan-900/40 bg-krosmoz-bg/80 backdrop-blur-lg sticky top-0 z-30">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-600 to-amber-400 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                    <i class="fa-solid fa-dice-d20 text-slate-950 text-xl"></i>
                </div>
                <div>
                    <h1 class="font-display font-black text-xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-teal-200 to-amber-300">
                        ROULETTE DOFUS
                    </h1>
                    <p class="text-xs text-cyan-400/70 font-semibold">19 Classes - Tirage Instantané</p>
                </div>
            </div>

            <!-- Audio & Reset Controls -->
            <div class="flex items-center space-x-4">
                <button id="soundToggleBtn" class="px-3 py-1.5 rounded-lg bg-slate-900 border border-cyan-800/50 hover:border-cyan-400 text-xs text-cyan-300 transition flex items-center gap-2">
                    <i id="soundIcon" class="fa-solid fa-volume-high text-amber-400"></i>
                    <span id="soundLabel" class="hidden sm:inline">Sons : ON</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col items-center gap-8">
        
        <!-- Roulette Section -->
        <div class="w-full flex flex-col items-center relative">
            
            <div class="relative w-full max-w-[460px] aspect-square flex items-center justify-center">
                
                <!-- Pointer -->
                <div id="wheelPointer" class="absolute top-0 left-1/2 -translate-x-1/2 z-20 pointer-events-none transition-transform duration-75 origin-top drop-shadow-[0_4px_10px_rgba(0,0,0,0.8)]">
                    <svg width="40" height="48" viewBox="0 0 40 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20 48L0 10C0 4.47715 4.47715 0 10 0H30C35.5228 0 40 4.47715 40 10L20 48Z" fill="url(#pointerGrad)"/>
                        <circle cx="20" cy="14" r="5" fill="#080c14"/>
                        <defs>
                            <linearGradient id="pointerGrad" x1="20" y1="0" x2="20" y2="48" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#fbbf24"/>
                                <stop offset="1" stop-color="#d97706"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>

                <!-- Canvas Wheel -->
                <canvas id="wheelCanvas" width="900" height="900" class="w-full h-full drop-shadow-[0_15px_35px_rgba(0,0,0,0.8)] cursor-pointer"></canvas>
                
                <!-- Center Button (Fast Launch) -->
                <button id="spinCenterBtn" class="absolute z-10 w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-slate-950 border-4 border-amber-400/90 shadow-[0_0_25px_rgba(251,191,36,0.5)] flex flex-col items-center justify-center group hover:scale-105 active:scale-95 transition-all">
                    <span class="font-display font-black text-amber-300 text-sm sm:text-base tracking-wider group-hover:text-white">GO</span>
                </button>
            </div>

            <!-- Giant Launch Button -->
            <div class="mt-6 w-full max-w-md">
                <button id="spinBtn" class="btn-neon-gold w-full py-4 rounded-2xl text-xl tracking-wider uppercase flex items-center justify-center gap-3">
                    <i class="fa-solid fa-rotate text-2xl"></i>
                    <span>Lancer la Roulette</span>
                </button>
            </div>

        </div>

        <div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- History Section (5 Last Winners) -->
            <div class="glass-panel rounded-2xl p-4 flex flex-col justify-between">
                <div>
                    <h2 class="font-display font-bold text-xs uppercase tracking-wider text-cyan-400 mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-clock-rotate-left"></i> Derniers tirages (5)
                    </h2>
                    <div id="historyList" class="flex flex-col gap-2">
                        <p id="emptyHistory" class="text-xs text-slate-500 italic py-2">Aucun tirage récent.</p>
                    </div>
                </div>
            </div>

            <!-- Quick Filter Checklist -->
            <div class="md:col-span-2 glass-panel rounded-2xl p-4">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="font-display font-bold text-xs uppercase tracking-wider text-cyan-400 flex items-center gap-2">
                        <i class="fa-solid fa-filter"></i> Classes incluses (<span id="activeCount">19</span>/19)
                    </h2>
                    <div class="flex gap-2">
                        <button id="selectAllBtn" class="text-[11px] px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-cyan-300 border border-cyan-800/40 transition">
                            Toutes
                        </button>
                        <button id="deselectAllBtn" class="text-[11px] px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-400 border border-slate-700 transition">
                            Aucune
                        </button>
                    </div>
                </div>

                <!-- Scrollable Checklist -->
                <div id="classesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2 max-h-[160px] overflow-y-auto pr-1">
                    <!-- Checkboxes dynamically generated via JS -->
                </div>
            </div>

        </div>

    </main>

    <!-- Victory Pop-up Modal (Minimal Pure Result) -->
    <div id="winnerModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="modalCard" class="glass-panel max-w-sm w-full rounded-3xl p-8 relative border-2 border-amber-400/80 text-center transform scale-75 transition-transform duration-300 shadow-[0_0_50px_rgba(251,191,36,0.3)]">
            
            <!-- Close Button -->
            <button id="closeModalBtn" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-900/80 hover:bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center transition border border-slate-700">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>

            <!-- Winner Header -->
            <div class="inline-block px-3 py-1 rounded-full bg-amber-400/10 border border-amber-400/40 text-amber-300 font-bold text-xs uppercase tracking-widest mb-6">
                ✨ CLASSE OBTENUE ✨
            </div>

            <!-- Big Icon Box -->
            <div class="relative w-32 h-32 mx-auto mb-6">
                <div id="modalGlow" class="absolute inset-0 rounded-3xl blur-2xl opacity-80 animate-pulse"></div>
                <div id="modalIconBox" class="relative w-full h-full rounded-3xl flex items-center justify-center text-7xl shadow-2xl border-2 border-white/20">
                    <span id="modalEmoji">⚔️</span>
                </div>
            </div>

            <!-- Class Name -->
            <h2 id="modalClassName" class="font-display font-black text-4xl text-white tracking-wide mb-8">
                Iop
            </h2>

            <!-- Action Buttons -->
            <div class="flex flex-col gap-2">
                <button id="spinAgainBtn" class="btn-neon-gold py-3.5 rounded-xl text-base uppercase tracking-wider font-extrabold flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rotate text-sm"></i> Re-tourner
                </button>
            </div>
        </div>
    </div>

    <script>
        // OFFICIAL 19 DOFUS CLASSES DATASET (Minimal & Vibrant)
        const DOFUS_CLASSES = [
            { id: 'feca', name: 'Féca', color: '#3b82f6', emoji: '🛡️' },
            { id: 'osamodas', name: 'Osamodas', color: '#10b981', emoji: '🐉' },
            { id: 'enutrof', name: 'Enutrof', color: '#eab308', emoji: '⛏️' },
            { id: 'sram', name: 'Sram', color: '#64748b', emoji: '💀' },
            { id: 'xelor', name: 'Xélor', color: '#8b5cf6', emoji: '⏳' },
            { id: 'ecaflip', name: 'Écaflip', color: '#f97316', emoji: '🎲' },
            { id: 'eniripsa', name: 'Éniripsa', color: '#ec4899', emoji: '🧚' },
            { id: 'iop', name: 'Iop', color: '#ef4444', emoji: '⚔️' },
            { id: 'cra', name: 'Crâ', color: '#84cc16', emoji: '🏹' },
            { id: 'sadida', name: 'Sadida', color: '#15803d', emoji: '🌿' },
            { id: 'sacrieur', name: 'Sacrieur', color: '#9f1239', emoji: '🩸' },
            { id: 'pandawa', name: 'Pandawa', color: '#14b8a6', emoji: '🍺' },
            { id: 'roublard', name: 'Roublard', color: '#0284c7', emoji: '💣' },
            { id: 'zobal', name: 'Zobal', color: '#a855f7', emoji: '🎭' },
            { id: 'steamer', name: 'Steamer', color: '#06b6d4', emoji: '⚓' },
            { id: 'eliotrop', name: 'Éliotrop', color: '#0ea5e9', emoji: '🌀' },
            { id: 'huppermage', name: 'Huppermage', color: '#f59e0b', emoji: '✨' },
            { id: 'ouginak', name: 'Oginak', color: '#d97706', emoji: '🐺' },
            { id: 'forgelance', name: 'Forgelance', color: '#f43f5e', emoji: '🔱' }
        ];

        // State Management
        let activeClasses = [...DOFUS_CLASSES];
        let disabledIds = new Set();
        let history = [];
        let isSpinning = false;
        let currentRotation = 0; // in radians
        let soundEnabled = true;

        // DOM Elements
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const spinCenterBtn = document.getElementById('spinCenterBtn');
        const wheelPointer = document.getElementById('wheelPointer');
        const activeCountEl = document.getElementById('activeCount');
        const classesGrid = document.getElementById('classesGrid');
        const historyList = document.getElementById('historyList');
        const emptyHistory = document.getElementById('emptyHistory');

        // Modal DOM
        const winnerModal = document.getElementById('winnerModal');
        const modalCard = document.getElementById('modalCard');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const spinAgainBtn = document.getElementById('spinAgainBtn');
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundIcon = document.getElementById('soundIcon');
        const soundLabel = document.getElementById('soundLabel');

        // Web Audio API Synthesizer (Realistic Ticks & Fanfare)
        const SoundSystem = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
            },
            playTick() {
                if (!soundEnabled) return;
                this.init();
                if (!this.ctx) return;

                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(520, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(140, this.ctx.currentTime + 0.03);

                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.03);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.03);
                } catch (e) {}
            },
            playVictory() {
                if (!soundEnabled) return;
                this.init();
                if (!this.ctx) return;

                try {
                    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                    notes.forEach((freq, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, this.ctx.currentTime + i * 0.07);

                        gain.gain.setValueAtTime(0, this.ctx.currentTime + i * 0.07);
                        gain.gain.linearRampToValueAtTime(0.25, this.ctx.currentTime + i * 0.07 + 0.02);
                        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + i * 0.07 + 0.35);

                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(this.ctx.currentTime + i * 0.07);
                        osc.stop(this.ctx.currentTime + i * 0.07 + 0.35);
                    });
                } catch (e) {}
            }
        };

        function drawWheel() {
            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = width / 2 - 24;

            ctx.clearRect(0, 0, width, height);

            if (activeClasses.length === 0) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.fillStyle = '#0f172a';
                ctx.fill();
                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 10;
                ctx.stroke();

                ctx.fillStyle = '#64748b';
                ctx.font = 'bold 32px Inter';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Aucune classe', centerX, centerY);
                return;
            }

            const arcSize = (Math.PI * 2) / activeClasses.length;

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(currentRotation);

            // Draw Slices
            activeClasses.forEach((cls, i) => {
                const startAngle = i * arcSize;
                const endAngle = startAngle + arcSize;

                // Slice Fill
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, startAngle, endAngle);
                ctx.closePath();

                ctx.fillStyle = cls.color;
                ctx.fill();

                // Slice Depth Overlay
                const grad = ctx.createRadialGradient(0, 0, radius * 0.15, 0, 0, radius);
                grad.addColorStop(0, 'rgba(0, 0, 0, 0.05)');
                grad.addColorStop(1, 'rgba(0, 0, 0, 0.4)');
                ctx.fillStyle = grad;
                ctx.fill();

                // Separator Line
                ctx.strokeStyle = '#080c14';
                ctx.lineWidth = 4;
                ctx.stroke();

                // Slice Content (Emoji + Name)
                ctx.save();
                ctx.rotate(startAngle + arcSize / 2);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';

                // Emoji
                ctx.font = '32px sans-serif';
                ctx.fillText(cls.emoji, radius - 30, 0);

                // Name
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 26px Cinzel, sans-serif';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                ctx.shadowBlur = 6;

                if (activeClasses.length > 14) {
                    ctx.font = 'bold 20px Cinzel, sans-serif';
                }

                ctx.fillText(cls.name, radius - 80, 0);
                ctx.restore();
            });

            // Outer Glowing Ring
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 10;
            ctx.stroke();

            // Decorative Dots on Circumference
            const dotCount = Math.max(activeClasses.length * 2, 24);
            for (let d = 0; d < dotCount; d++) {
                const dotAngle = (Math.PI * 2 / dotCount) * d;
                const dx = Math.cos(dotAngle) * (radius - 1);
                const dy = Math.sin(dotAngle) * (radius - 1);
                ctx.beginPath();
                ctx.arc(dx, dy, 3.5, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            }

            ctx.restore();
        }

        // Filter Refresh
        function updateActiveClasses() {
            activeClasses = DOFUS_CLASSES.filter(c => !disabledIds.has(c.id));
            activeCountEl.textContent = activeClasses.length;

            spinBtn.disabled = activeClasses.length === 0 || isSpinning;
            spinCenterBtn.disabled = activeClasses.length === 0 || isSpinning;

            drawWheel();
        }

        // Generate Quick Checklist Grid
        function initChecklist() {
            classesGrid.innerHTML = '';
            DOFUS_CLASSES.forEach(cls => {
                const label = document.createElement('label');
                label.className = 'flex items-center gap-2 p-2 rounded-xl bg-slate-900/60 hover:bg-slate-800/80 border border-slate-800/80 cursor-pointer transition select-none text-xs';
                
                const checked = !disabledIds.has(cls.id);
                label.innerHTML = `
                    <input type="checkbox" data-id="${cls.id}" ${checked ? 'checked' : ''} 
                        class="rounded border-slate-700 bg-slate-950 text-amber-400 focus:ring-0">
                    <span class="text-sm">${cls.emoji}</span>
                    <span class="font-bold text-slate-200 truncate flex-1">${cls.name}</span>
                `;

                const checkbox = label.querySelector('input');
                checkbox.addEventListener('change', (e) => {
                    if (e.target.checked) disabledIds.delete(cls.id);
                    else disabledIds.add(cls.id);
                    updateActiveClasses();
                });

                classesGrid.appendChild(label);
            });
        }

        function spinWheel() {
            if (isSpinning || activeClasses.length === 0) return;

            isSpinning = true;
            spinBtn.disabled = true;
            spinCenterBtn.disabled = true;

            // Pick Random Winner
            const winnerIndex = Math.floor(Math.random() * activeClasses.length);
            const winner = activeClasses[winnerIndex];

            const arcSize = (Math.PI * 2) / activeClasses.length;
            const sliceCenterAngle = winnerIndex * arcSize + arcSize / 2;
            
            // Random offset within the slice
            const randomOffset = (Math.random() - 0.5) * (arcSize * 0.6);
            const extraRounds = Math.floor(Math.random() * 3) + 5;

            // Target final rotation angle (align slice center to top pointer at 1.5 * PI)
            const targetRotation = currentRotation + (extraRounds * Math.PI * 2) + ((Math.PI * 1.5 - sliceCenterAngle - (currentRotation % (Math.PI * 2))) % (Math.PI * 2)) + randomOffset;

            const startTime = performance.now();
            const duration = 4800; // 4.8 seconds
            let lastArcIndex = -1;

            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);

                // Cubic Easing Out
                const easeOut = 1 - Math.pow(1 - progress, 3);
                currentRotation = currentRotation + (targetRotation - currentRotation) * 0.045;

                // Ticking Audio & Visual bounce
                const normalizedRotation = (Math.PI * 2 - (currentRotation % (Math.PI * 2))) % (Math.PI * 2);
                const currentArcIndex = Math.floor(((normalizedRotation + Math.PI / 2) % (Math.PI * 2)) / arcSize);
                
                if (currentArcIndex !== lastArcIndex) {
                    SoundSystem.playTick();
                    wheelPointer.style.transform = 'translateX(-50%) rotate(-14deg)';
                    setTimeout(() => wheelPointer.style.transform = 'translateX(-50%) rotate(0deg)', 40);
                    lastArcIndex = currentArcIndex;
                }

                drawWheel();

                if (progress < 1 && Math.abs(targetRotation - currentRotation) > 0.002) {
                    requestAnimationFrame(animate);
                } else {
                    currentRotation = targetRotation;
                    drawWheel();
                    isSpinning = false;
                    spinBtn.disabled = false;
                    spinCenterBtn.disabled = false;
                    
                    showVictory(winner);
                }
            }

            requestAnimationFrame(animate);
        }

        function showVictory(winner) {
            SoundSystem.playVictory();

            // Trigger Confetti
            confetti({
                particleCount: 80,
                spread: 70,
                origin: { y: 0.6 },
                colors: [winner.color, '#fbbf24', '#06b6d4']
            });

            // Update History (5 Max)
            history.unshift(winner);
            if (history.length > 5) history.pop();
            renderHistory();

            // Populate Victory Modal
            document.getElementById('modalEmoji').textContent = winner.emoji;
            document.getElementById('modalClassName').textContent = winner.name;
            document.getElementById('modalIconBox').style.backgroundColor = winner.color;
            document.getElementById('modalGlow').style.backgroundColor = winner.color;

            // Open Modal
            winnerModal.classList.remove('opacity-0', 'pointer-events-none');
            modalCard.classList.remove('scale-75');
            modalCard.classList.add('scale-100', 'animate-pop-in');
        }

        function closeModal() {
            winnerModal.classList.add('opacity-0', 'pointer-events-none');
            modalCard.classList.remove('scale-100', 'animate-pop-in');
            modalCard.classList.add('scale-75');
        }

        function renderHistory() {
            if (history.length === 0) {
                emptyHistory.classList.remove('hidden');
                return;
            }

            emptyHistory.classList.add('hidden');
            historyList.innerHTML = '';

            history.forEach((cls) => {
                const item = document.createElement('div');
                item.className = 'flex items-center gap-3 p-2 rounded-xl bg-slate-900/80 border border-slate-800 text-xs font-bold text-slate-200';
                item.innerHTML = `
                    <span class="w-6 h-6 rounded-lg flex items-center justify-center text-sm" style="background-color: ${cls.color}">${cls.emoji}</span>
                    <span class="flex-1">${cls.name}</span>
                `;
                historyList.appendChild(item);
            });
        }

        // Event Listeners
        function initEvents() {
            spinBtn.addEventListener('click', spinWheel);
            spinCenterBtn.addEventListener('click', spinWheel);

            closeModalBtn.addEventListener('click', closeModal);
            spinAgainBtn.addEventListener('click', () => {
                closeModal();
                setTimeout(spinWheel, 250);
            });

            winnerModal.addEventListener('click', (e) => {
                if (e.target === winnerModal) closeModal();
            });

            document.getElementById('selectAllBtn').addEventListener('click', () => {
                disabledIds.clear();
                initChecklist();
                updateActiveClasses();
            });

            document.getElementById('deselectAllBtn').addEventListener('click', () => {
                DOFUS_CLASSES.forEach(c => disabledIds.add(c.id));
                initChecklist();
                updateActiveClasses();
            });

            soundToggleBtn.addEventListener('click', () => {
                soundEnabled = !soundEnabled;
                soundIcon.className = soundEnabled ? 'fa-solid fa-volume-high text-amber-400' : 'fa-solid fa-volume-xmark text-slate-500';
                soundLabel.textContent = soundEnabled ? 'Sons : ON' : 'Sons : OFF';
            });
        }

        // On Page Load
        window.onload = function() {
            initChecklist();
            updateActiveClasses();
            initEvents();
            drawWheel();
        };
    </script>
</body>
</html>
